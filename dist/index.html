<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfd8e3"><meta name="description" content="自由搭建三维水上小镇。">
<title>小小潮汐</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<canvas id="world" tabindex="0" aria-label="三维小镇，轻点编辑，拖动环绕，双指平移和缩放，开启连续刷可批量编辑"></canvas>
<div id="loading" role="status"><span class="spinner"></span><span>加载中</span></div>
<div id="ui-root"></div>
<script type="module">
import('./ui.js').then(()=>import('./game.js')).catch(error=>{
  console.error(error);const loading=document.getElementById('loading');
  if(loading){loading.classList.remove('done');loading.textContent='加载失败，请刷新重试';}
});
</script>
</body></html>
