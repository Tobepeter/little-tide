<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfd8e3"><meta name="description" content="自由搭建三维水上小镇。">
<title>小小潮汐</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<canvas id="world" tabindex="0" aria-label="三维小镇，轻点编辑，拖动环绕，双指平移和缩放，开启连续刷可批量编辑"></canvas>
<div id="loading" role="status" aria-live="polite">
  <svg class="loading-scene" viewBox="0 0 200 196" aria-hidden="true" focusable="false">
    <ellipse cx="100" cy="155" rx="73" ry="23" fill="#80b7cd" opacity=".22"/>
    <g fill="none" stroke="#e0f1f5" stroke-width="1.5">
      <ellipse class="loading-ripple" cx="100" cy="155" rx="61" ry="19"/>
      <ellipse class="loading-ripple loading-ripple-later" cx="100" cy="155" rx="61" ry="19"/>
    </g>
    <ellipse class="loading-shadow" cx="100" cy="153" rx="45" ry="14" fill="#548fac" opacity=".2"/>
    <g class="loading-float" stroke-linejoin="round">
      <g class="loading-foundation">
        <path d="m40 136 60 27v10l-60-27Z" fill="#8fa4af"/>
        <path d="m100 163 60-27v10l-60 27Z" fill="#748fa0"/>
        <path d="m40 136 60-27 60 27-60 27Z" fill="#e7ded0"/>
        <path d="m40 136 60 27 60-27" fill="none" stroke="#f8f0e3" stroke-width="2"/>
      </g>
      <g class="loading-walls">
        <path d="m61 86 39 17v43l-39-17Z" fill="#de9da0"/>
        <path d="m100 103 42-21v43l-42 21Z" fill="#bd7e8b"/>
        <path d="m61 86 19-25 20 42Z" fill="#edb6b1"/>
        <path d="m71 111 12 5v22l-12-5Z" fill="#a76977"/>
        <path d="m74 115 7 3v18l-7-3Z" fill="#8f6375"/>
        <path d="m66 96 8 3v10l-8-3Z" fill="#fff0d8"/>
        <path d="m68 99 4 1.5v6l-4-1.5Z" fill="#6a9daf"/>
        <path d="m86 105 8 3v10l-8-3Z" fill="#fff0d8"/>
        <path d="m88 108 4 1.5v6l-4-1.5Z" fill="#6a9daf"/>
        <path d="m112 105 18-9v19l-18 9Z" fill="#f8e5cb"/>
        <path d="m115 106 12-6v13l-12 6Z" fill="#608b9e"/>
        <path class="loading-window" d="m115 106 12-6v13l-12 6Z" fill="#ffe0a2"/>
        <path d="m121 103v13m-6-3.5 12-6" fill="none" stroke="#f8e5cb" stroke-width="1.5"/>
        <path d="m109 124 23-11v3l-23 11Z" fill="#a2697b"/>
        <path d="m72 137 12 5 5-2-12-5Z" fill="#f4e8d8"/>
        <circle cx="79" cy="126" r="1" fill="#e7bd88"/>
      </g>
      <g class="loading-roof">
        <path d="m53 86 27-28 46-23-28 28Z" fill="#f5ddba"/>
        <path d="m80 58 46-23 25 45-48 25Z" fill="#e9c397"/>
        <path d="m103 105 48-25v5l-48 24Z" fill="#c69880"/>
        <path d="m53 86 27-28 23 47v4L80 66 53 91Z" fill="#fae6c8"/>
        <path d="m96 51 23 45m-7-53 23 44" fill="none" stroke="#dab28d" stroke-width="1.4"/>
        <path d="m80 58 46-23" fill="none" stroke="#fff0d3" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
  <div class="loading-caption">
    <span id="loading-status">加载中</span>
    <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <button id="loading-retry" class="loading-retry" type="button" hidden>重新加载</button>
</div>
<div id="ui-root"></div>
<script type="module">
import('./ui.js').then(()=>import('./game.js')).catch(error=>{
  console.error(error);const loading=document.getElementById('loading');
  if(loading){
    loading.classList.remove('done');loading.dataset.state='error';loading.setAttribute('role','alert');loading.removeAttribute('aria-hidden');
    document.getElementById('loading-status').textContent='小镇暂时没能打开';
    const retry=document.getElementById('loading-retry');retry.hidden=false;retry.addEventListener('click',()=>location.reload());
  }
});
</script>
</body></html>
